<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="270" r="140" fill="#10b981" opacity="0.25" filter="url(#glow)" />

  <!-- Iconic Flame Silhouette -->
  <g transform="translate(106, 86) scale(0.585)" filter="url(#glow)">
    <path
      d="M256 0C256 0 290 92 232 174C174 256 120 280 120 360C120 440 180 512 256 512C332 512 392 440 392 360C392 240 304 160 304 160C304 160 336 216 320 264C304 312 264 328 264 368C264 400 284 416 304 416C304 416 280 432 248 432C208 432 184 400 184 360C184 288 248 240 256 0Z"
      fill="url(#flameGrad)"
    />
  </g>

  <!-- Subtitle Accent -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#2dd4bf" text-anchor="middle" letter-spacing="4">NUTRITRACK</text>
</svg>
